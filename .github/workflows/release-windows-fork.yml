name: release-windows-fork

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.2.15-fork.1)"
        required: true
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
      - "fork-v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RUST_TARGET: x86_64-pc-windows-msvc
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build sidecar for desktop
        shell: pwsh
        run: bun --cwd packages/desktop ./scripts/predev.ts

      - name: Build Windows desktop installer
        shell: pwsh
        run: bun --cwd packages/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer produced." }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $installer.FullName "dist/opencode-desktop-windows-x64.exe"

          $hash = (Get-FileHash "dist/opencode-desktop-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  opencode-desktop-windows-x64.exe" | Out-File -FilePath "dist/opencode-desktop-windows-x64.exe.sha256" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG_NAME }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/opencode-desktop-windows-x64.exe
            dist/opencode-desktop-windows-x64.exe.sha256
